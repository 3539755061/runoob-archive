<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-label="Agent Skills 任务执行闭环"><title>Agent Skills 任务执行闭环</title><desc>Skill 提供操作规范；Agent 决定下一步并整合结果</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6E8092" stroke-width="1.5"/></marker></defs><rect width="760" height="930" fill="#F4F7FA" rx="14"/><style>text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#233242}.title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#6E8092}.label{font-size:17px;font-weight:650}.body{font-size:13px;fill:#6E8092}.small{font-size:12px;fill:#6E8092}</style><text x="380" y="46" text-anchor="middle" class="title">Agent Skills 任务执行闭环</text><text x="380" y="71" text-anchor="middle" class="subtitle">Skill 提供操作规范；Agent 决定下一步并整合结果</text><rect x="132" y="100" width="496" height="73" rx="10" fill="#FFFFFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="131" text-anchor="middle" class="label">用户提出任务</text><text x="380" y="154" text-anchor="middle" class="body">例如：分析 PDF 并整理摘要</text><path d="M380 173 L380 192" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="132" y="199" width="496" height="73" rx="10" fill="#E8EEFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="230" text-anchor="middle" class="label">Agent 理解任务并匹配 Skill</text><text x="380" y="253" text-anchor="middle" class="body">参考已发现的名称、描述或显式指定</text><path d="M380 272 L380 291" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="132" y="298" width="496" height="73" rx="10" fill="#E8EEFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="329" text-anchor="middle" class="label">加载 SKILL.md</text><text x="380" y="352" text-anchor="middle" class="body">获得相关指令、流程与资源位置</text><path d="M380 371 L380 390" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="132" y="397" width="496" height="73" rx="10" fill="#FFFFFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="428" text-anchor="middle" class="label">模型制定操作方案</text><text x="380" y="451" text-anchor="middle" class="body">判断是否需要文件、脚本或外部工具</text><path d="M380 470 L380 489" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="132" y="496" width="496" height="73" rx="10" fill="#FFF3E6" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="527" text-anchor="middle" class="label">按需调用工具或执行脚本</text><text x="380" y="550" text-anchor="middle" class="body">仅在运行环境和权限允许时执行</text><path d="M380 569 L380 588" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="132" y="595" width="496" height="73" rx="10" fill="#E9F7F1" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="626" text-anchor="middle" class="label">执行状态 / 数据反馈给 Agent</text><text x="380" y="649" text-anchor="middle" class="body">文字、错误、文件路径等返回结果</text><path d="M380 668 L380 687" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="132" y="694" width="496" height="73" rx="10" fill="#E8EEFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="725" text-anchor="middle" class="label">模型检查结果并决定下一步</text><text x="380" y="748" text-anchor="middle" class="body">需要时继续工具调用，或处理无法完成的原因</text><path d="M380 767 L380 786" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="132" y="793" width="496" height="73" rx="10" fill="#FFFFFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="824" text-anchor="middle" class="label">Agent 生成最终回复</text><text x="380" y="847" text-anchor="middle" class="body">向用户提供答案、来源及交付文件</text><path d="M132 730 H71 V531 H126" fill="none" stroke="#CA8143" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="60" y="626" text-anchor="middle" transform="rotate(-90 60 626)" style="font-size:12px;fill:#CA8143">必要时循环执行</text><text x="380" y="907" text-anchor="middle" class="small">说明：没有工具调用需求时，可直接根据 Skill 指令生成答案</text></svg>