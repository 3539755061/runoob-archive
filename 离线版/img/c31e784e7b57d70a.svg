<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title>计划与执行的边界</title><desc>先列计划和真正改文件是两件事</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf4fa"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a354d" flood-opacity=".10"/></filter></defs><rect width="900" height="420" rx="18" fill="url(#bg)"/><rect x="80" y="105" width="325" height="175" rx="14" fill="#ffffff" stroke="#d2dfea" filter="url(#shadow)"/><text x="242.5" y="144" text-anchor="middle" font-size="22" font-weight="600" fill="#253e51" font-family="Arial,'Noto Sans CJK SC',sans-serif">Plan：只拟方案</text><text x="242.5" y="178" text-anchor="middle" font-size="15" fill="#668193" font-family="Arial,'Noto Sans CJK SC',sans-serif">列步骤、交付物、风险</text><rect x="495" y="105" width="325" height="175" rx="14" fill="#ffffff" stroke="#d2dfea" filter="url(#shadow)"/><text x="657.5" y="144" text-anchor="middle" font-size="22" font-weight="600" fill="#253e51" font-family="Arial,'Noto Sans CJK SC',sans-serif">Execute：开始操作</text><text x="657.5" y="178" text-anchor="middle" font-size="15" fill="#668193" font-family="Arial,'Noto Sans CJK SC',sans-serif">读取、创建、修改和导出</text><path d="M410 192 L488 192" fill="none" stroke="#7193a7" stroke-width="3" stroke-linecap="round"/><path d="M477 185 L488 192 L477 199" fill="none" stroke="#7193a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="390" text-anchor="middle" font-size="17" fill="#526a7b" font-family="Arial,'Noto Sans CJK SC',sans-serif">先看计划是否合理，再授权执行真实操作</text></svg>