<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="AI 应用等于模型加工具界面加你的任务" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle}
.t{font-size:22px;font-weight:700;fill:#1e293b}
.s{font-size:14px;fill:#475569}
.op{font-size:38px;font-weight:700;fill:#94a3b8}
.k{font-size:15px;fill:#64748b}
</style></defs>
<rect width="800" height="300" rx="16" fill="#f8fafc"/>
<text x="400" y="46" font-size="24" font-weight="700" fill="#1e293b">AI 应用 = 模型 + 工具界面 + 你的任务</text>

<rect x="40" y="75" width="150" height="125" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<rect x="102" y="92" width="26" height="26" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
<circle cx="115" cy="105" r="5" fill="#3b82f6"/>
<text x="115" y="148" class="t">模型</text><text x="115" y="173" class="s">能力的来源</text>

<rect x="230" y="75" width="150" height="125" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
<rect x="290" y="92" width="30" height="24" rx="4" fill="#fff" stroke="#22c55e" stroke-width="2"/>
<line x1="290" y1="100" x2="320" y2="100" stroke="#22c55e" stroke-width="2"/>
<text x="305" y="148" class="t">工具界面</text><text x="305" y="173" class="s">普通人也能用的入口</text>

<rect x="420" y="75" width="150" height="125" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<line x1="488" y1="90" x2="488" y2="120" stroke="#f59e0b" stroke-width="3"/>
<path d="M488 90 L508 98 L488 106 Z" fill="#f59e0b"/>
<text x="495" y="148" class="t">你的任务</text><text x="495" y="173" class="s">决定要去哪里</text>

<rect x="610" y="75" width="150" height="125" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
<circle cx="685" cy="105" r="14" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
<path d="M678 105 L683 110 L693 99" fill="none" stroke="#8b5cf6" stroke-width="3"/>
<text x="685" y="148" class="t">AI 应用</text><text x="685" y="173" class="s">能交付成果的工具</text>

<text x="210" y="150" class="op">+</text><text x="400" y="150" class="op">+</text><text x="590" y="150" class="op">=</text>

<text x="115" y="232" class="k">≈ 发动机</text><text x="305" y="232" class="k">≈ 车身和方向盘</text>
<text x="495" y="232" class="k">≈ 目的地</text><text x="685" y="232" class="k">≈ 一辆能开的车</text>
<text x="400" y="278" font-size="16" fill="#334155">学会“怎么用”，比记住“用哪个品牌”更重要</text>
</svg>
