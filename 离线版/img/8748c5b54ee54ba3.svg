<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect width="860" height="430" rx="14" fill="#faf7f2"/>

  <text x="430" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a3226">Python SDK 调用流程（sdk-minimal profile）</text>

  <!-- Python program -->
  <rect x="40" y="70" width="220" height="120" rx="10" fill="#ffffff" stroke="#d8cdb8" stroke-width="1.5"/>
  <text x="150" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3226">你的 Python 程序</text>
  <text x="150" y="124" text-anchor="middle" font-size="12" fill="#6b6352">with DeepSeekHarness(...) as h:</text>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="#6b6352">h.run(task, session_id)</text>
  <text x="150" y="170" text-anchor="middle" font-size="11" fill="#9a8f78">退出 with 块时自动释放</text>

  <!-- runtime -->
  <rect x="330" y="70" width="220" height="120" rx="10" fill="#f0e9dc" stroke="#c9b68e" stroke-width="1.5"/>
  <text x="440" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a4632">内置运行时</text>
  <text x="440" y="124" text-anchor="middle" font-size="12" fill="#6b6352">dsh --profile sdk-minimal</text>
  <text x="440" y="148" text-anchor="middle" font-size="11" fill="#9a8f78">延迟启动，进程持续复用</text>
  <text x="440" y="170" text-anchor="middle" font-size="11" fill="#9a8f78">不需要系统 Node.js</text>

  <!-- agent loop -->
  <rect x="620" y="70" width="200" height="120" rx="10" fill="#ffffff" stroke="#d8cdb8" stroke-width="1.5"/>
  <text x="720" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3226">Agent Loop</text>
  <text x="720" y="124" text-anchor="middle" font-size="12" fill="#6b6352">模型请求 → 工具调用</text>
  <text x="720" y="148" text-anchor="middle" font-size="11" fill="#9a8f78">自动上下文压缩</text>
  <text x="720" y="170" text-anchor="middle" font-size="11" fill="#9a8f78">请求前等待历史刷盘</text>

  <line x1="260" y1="130" x2="322" y2="130" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="291" y="120" text-anchor="middle" font-size="10" fill="#9a8f78">JSON-RPC</text>
  <line x1="550" y1="130" x2="612" y2="130" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- tools row -->
  <text x="430" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a4632">面向模型的默认工具</text>

  <rect x="120" y="256" width="180" height="58" rx="9" fill="#ffffff" stroke="#c9b68e" stroke-width="1.5"/>
  <text x="210" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4632">bash（持久）</text>
  <text x="210" y="300" text-anchor="middle" font-size="10.5" fill="#9a8f78">Windows 为 pwsh</text>

  <rect x="340" y="256" width="180" height="58" rx="9" fill="#ffffff" stroke="#c9b68e" stroke-width="1.5"/>
  <text x="430" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4632">read_image</text>
  <text x="430" y="300" text-anchor="middle" font-size="10.5" fill="#9a8f78">读取图片附件</text>

  <rect x="560" y="256" width="180" height="58" rx="9" fill="#ffffff" stroke="#c9b68e" stroke-width="1.5"/>
  <text x="650" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4632">working_directory</text>
  <text x="650" y="300" text-anchor="middle" font-size="10.5" fill="#9a8f78">查询 / 切换当前目录</text>

  <line x1="720" y1="190" x2="720" y2="240" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="650" y1="240" x2="210" y2="240" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- persistence row -->
  <rect x="120" y="348" width="300" height="56" rx="9" fill="#f0e9dc" stroke="#c9b68e" stroke-width="1.5"/>
  <text x="270" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4632">&lt;dsh_home&gt;/sessions/ 未压缩 JSONL</text>
  <text x="270" y="391" text-anchor="middle" font-size="10.5" fill="#9a8f78">会话日志：模型请求与工具调用全程落盘</text>

  <rect x="460" y="348" width="280" height="56" rx="9" fill="#ffffff" stroke="#d8cdb8" stroke-width="1.5"/>
  <text x="600" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4632">str_replace_editor（可选）</text>
  <text x="600" y="391" text-anchor="middle" font-size="10.5" fill="#9a8f78">默认不挂载，经 editor.patch.yml 启用</text>

  <line x1="270" y1="314" x2="270" y2="342" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="600" y1="314" x2="600" y2="342" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3"/>
</svg>
