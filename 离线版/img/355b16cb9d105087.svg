<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-label="Skills 渐进式加载"><title>Skills 渐进式加载</title><desc>只加载当前任务需要的信息，不一次性读取所有文件</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6E8092" stroke-width="1.5"/></marker></defs><rect width="760" height="650" fill="#F4F7FA" rx="14"/><style>text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#233242}.title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#6E8092}.label{font-size:17px;font-weight:650}.body{font-size:13px;fill:#6E8092}.small{font-size:12px;fill:#6E8092}</style><text x="380" y="46" text-anchor="middle" class="title">Skills 渐进式加载</text><text x="380" y="71" text-anchor="middle" class="subtitle">只加载当前任务需要的信息，不一次性读取所有文件</text><rect x="100" y="90" width="560" height="122" rx="10" fill="#E8EEFF" stroke="#D6DEE7" stroke-width="1.2"/><rect x="117" y="109" width="48" height="32" rx="7" fill="#FFFFFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="141" y="131" text-anchor="middle" class="label">01</text><text x="186" y="132" text-anchor="start" class="label">发现 Discovery</text><text x="380" y="163" text-anchor="middle" class="label">name + description</text><text x="380" y="188" text-anchor="middle" class="body">轻量元数据：识别可能适用的 Skill</text><rect x="100" y="248" width="560" height="122" rx="10" fill="#FFFFFF" stroke="#D6DEE7" stroke-width="1.2"/><rect x="117" y="267" width="48" height="32" rx="7" fill="#FFFFFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="141" y="289" text-anchor="middle" class="label">02</text><text x="186" y="290" text-anchor="start" class="label">激活 Activation</text><text x="380" y="321" text-anchor="middle" class="label">完整 SKILL.md</text><text x="380" y="346" text-anchor="middle" class="body">模型获得任务流程、规范与资源路径</text><rect x="100" y="406" width="560" height="122" rx="10" fill="#E9F7F1" stroke="#D6DEE7" stroke-width="1.2"/><rect x="117" y="425" width="48" height="32" rx="7" fill="#FFFFFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="141" y="447" text-anchor="middle" class="label">03</text><text x="186" y="448" text-anchor="start" class="label">执行 Execution</text><text x="380" y="479" text-anchor="middle" class="label">按需读取 references / 使用 assets / 运行 scripts</text><text x="380" y="504" text-anchor="middle" class="body">脚本输出或工具结果反馈给 Agent</text><path d="M380 212 L380 243" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M380 370 L380 401" fill="none" stroke="#6E8092" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="100" y="555" width="560" height="62" rx="10" fill="#FFFFFF" stroke="#D6DEE7" stroke-width="1.2"/><text x="380" y="582" text-anchor="middle" class="body">关键区别：脚本不会自动执行，也不一定全文载入模型上下文</text><text x="380" y="600" text-anchor="middle" class="small">通常只有按需读取的资料和实际执行结果进入后续处理</text></svg>