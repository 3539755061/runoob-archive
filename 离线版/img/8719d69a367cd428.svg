<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1180" viewBox="0 0 840 1180" role="img" aria-labelledby="title desc">
<title id="title">Agent Skills 加载与执行流程</title>
<desc id="desc">用户提出需求、Agent 匹配 Skill 元数据、按需加载 SKILL.md、规划任务、调用脚本或工具、将结果反馈模型、检查后向用户回复，失败可循环处理。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6E8092"/></marker></defs>
<rect width="840" height="1180" rx="18" fill="#F4F7FA"/>
<text x="420" y="55" text-anchor="middle" font-family="'Noto Sans Mono CJK SC',sans-serif" font-size="27" font-weight="700" fill="#233242">Agent Skills 加载与执行流程</text>
<text x="420" y="86" text-anchor="middle" font-family="'Noto Sans Mono CJK SC',sans-serif" font-size="15" fill="#6E8092">Skill 提供任务指令；Agent 负责决策、执行与整合结果</text>
<g font-family="'Noto Sans Mono CJK SC',sans-serif" text-anchor="middle">
<rect x="180" y="116" width="480" height="68" rx="9" fill="#FBFCFE" stroke="#D6DEE7" stroke-width="1.6"/><text x="420" y="145" fill="#233242" font-size="19" font-weight="600">用户提出任务</text><text x="420" y="170" fill="#6E8092" font-size="14">例如：分析 PDF 并提取主要结论</text>
<path d="M420 184 V221" stroke="#6E8092" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="225" width="480" height="82" rx="9" fill="#E8EEFF" stroke="#9CB3DB" stroke-width="1.6"/><text x="420" y="257" fill="#00247D" font-size="18" font-weight="600">Agent 匹配 Skill</text><text x="420" y="281" fill="#425A7C" font-size="14">通过 name / description 等发现合适的能力</text>
<path d="M420 307 V345" stroke="#6E8092" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="349" width="480" height="82" rx="9" fill="#E8EEFF" stroke="#9CB3DB" stroke-width="1.6"/><text x="420" y="380" fill="#00247D" font-size="18" font-weight="600">按需加载 SKILL.md</text><text x="420" y="405" fill="#425A7C" font-size="14">指令进入模型可用上下文，而非立即运行代码</text>
<path d="M420 431 V469" stroke="#6E8092" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="473" width="480" height="82" rx="9" fill="#E8EEFF" stroke="#9CB3DB" stroke-width="1.6"/><text x="420" y="505" fill="#00247D" font-size="18" font-weight="600">模型规划下一步操作</text><text x="420" y="530" fill="#425A7C" font-size="14">需要时读取 references / assets 或选择工具</text>
<path d="M420 555 V593" stroke="#6E8092" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="597" width="480" height="82" rx="9" fill="#FBFCFE" stroke="#A8B7C9" stroke-width="1.7"/><text x="420" y="628" fill="#233242" font-size="18" font-weight="600">按权限调用工具 / scripts</text><text x="420" y="653" fill="#6E8092" font-size="14">例如读取 PDF、解析文本、生成摘要资料</text>
<path d="M420 679 V717" stroke="#6E8092" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="721" width="480" height="82" rx="9" fill="#E9F3ED" stroke="#9BC4A7" stroke-width="1.7"/><text x="420" y="752" fill="#25583B" font-size="18" font-weight="600">执行结果反馈给 Agent</text><text x="420" y="777" fill="#467057" font-size="14">文本、状态、错误或产物路径进入后续处理</text>
<path d="M420 803 V841" stroke="#6E8092" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="845" width="480" height="82" rx="9" fill="#E8EEFF" stroke="#9CB3DB" stroke-width="1.6"/><text x="420" y="877" fill="#00247D" font-size="18" font-weight="600">模型分析、验证并决定是否继续</text><text x="420" y="902" fill="#425A7C" font-size="14">需要时修复、补充工具调用或继续处理</text>
<path d="M420 927 V965" stroke="#6E8092" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="969" width="480" height="76" rx="9" fill="#FBFCFE" stroke="#D6DEE7" stroke-width="1.6"/><text x="420" y="1000" fill="#233242" font-size="18" font-weight="600">最终向用户回复 / 交付成果</text><text x="420" y="1024" fill="#6E8092" font-size="14">提供结论、引用、文件或失败原因</text>
</g>
<path d="M180 885 H96 V639 H178" fill="none" stroke="#D28A44" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="74" y="750" text-anchor="middle" transform="rotate(-90 74 750)" font-size="15" font-family="'Noto Sans Mono CJK SC',sans-serif" fill="#A46A34">需要时继续执行</text>
<path d="M660 393 H735 V517 H660" fill="none" stroke="#A8B7C9" stroke-width="1.7" stroke-dasharray="6 6"/>
<text x="735" y="447" text-anchor="middle" font-size="13" font-family="'Noto Sans Mono CJK SC',sans-serif" fill="#647892">按需</text><text x="735" y="467" text-anchor="middle" font-size="13" font-family="'Noto Sans Mono CJK SC',sans-serif" fill="#647892">补充资料</text>
<line x1="56" y1="1093" x2="784" y2="1093" stroke="#D6DEE7" stroke-width="1.5"/>
<text x="420" y="1127" text-anchor="middle" font-family="'Noto Sans Mono CJK SC',sans-serif" font-size="15" fill="#42566D">Skill ≠ 独立执行器 · 脚本与工具结果不绕过模型直接回答用户</text>
<text x="420" y="1154" text-anchor="middle" font-family="'Noto Sans Mono CJK SC',sans-serif" font-size="13" fill="#7A8A9C">通用流程示意，具体步骤取决于 Agent 实现与任务</text>
</svg>
