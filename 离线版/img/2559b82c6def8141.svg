<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="通用协作方法：四步循环与三条原则" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle}
.t{font-size:20px;font-weight:700;fill:#1e293b}
.s{font-size:13px;fill:#475569}
.p{font-size:17px;font-weight:700;fill:#1e293b}
</style></defs>
<rect width="800" height="340" rx="16" fill="#f8fafc"/>
<text x="400" y="38" font-size="22" font-weight="700" fill="#1e293b">通用协作方法：四步循环</text>

<rect x="40" y="62" width="150" height="76" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="115" y="95" class="t">① 你定方向</text><text x="115" y="119" class="s">说清目标和要求</text>
<rect x="230" y="62" width="150" height="76" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="305" y="95" class="t">② AI 执行</text><text x="305" y="119" class="s">起草、生成、处理</text>
<rect x="420" y="62" width="150" height="76" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="495" y="95" class="t">③ 你检查</text><text x="495" y="119" class="s">核对事实和细节</text>
<rect x="610" y="62" width="150" height="76" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="685" y="95" class="t">④ 一起修改</text><text x="685" y="119" class="s">补充意见再来一轮</text>
<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="190" y1="100" x2="228" y2="100"/><line x1="380" y1="100" x2="418" y2="100"/><line x1="570" y1="100" x2="608" y2="100"/>
</g>
<path d="M685 138 V172 H115 V142" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="400" y="196" class="s">多轮迭代，直到满意</text>

<rect x="40" y="226" width="220" height="80" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="150" y="258" class="p">先小样，再批量</text><text x="150" y="284" class="s">确认方向后再大量生成</text>
<rect x="290" y="226" width="220" height="80" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="400" y="258" class="p">错误挡在花钱之前</text><text x="400" y="284" class="s">文字 → 图片 → 视频逐层检查</text>
<rect x="540" y="226" width="220" height="80" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="650" y="258" class="p">关键内容自己把关</text><text x="650" y="284" class="s">AI 写初稿，你来拍板</text>
</svg>
