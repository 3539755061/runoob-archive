<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-label="AI 工具选型流程" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle}
.q{font-size:18px;font-weight:700;fill:#1e293b}
.a{font-size:18px;font-weight:700;fill:#1e293b}
.s{font-size:14px;fill:#475569}
.y{font-size:15px;font-weight:700;fill:#64748b}
</style></defs>
<rect width="800" height="410" rx="16" fill="#fff"/>
<text x="400" y="34" font-size="22" font-weight="700" fill="#1e293b">工具选型流程</text>

<rect x="40" y="52" width="300" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="190" y="88" class="q">要读写本地文件吗？</text>
<rect x="40" y="147" width="300" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="190" y="183" class="q">要写代码或做网页吗？</text>
<rect x="40" y="242" width="300" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="190" y="278" class="q">要生成视频吗？</text>
<rect x="40" y="337" width="300" height="60" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="190" y="365" class="a">对话助手</text><text x="190" y="387" class="s">DeepSeek / Qwen</text>

<g stroke="#64748b" stroke-width="2" marker-end="url(#a)">
<line x1="190" y1="112" x2="190" y2="145"/><line x1="190" y1="207" x2="190" y2="240"/><line x1="190" y1="302" x2="190" y2="335"/>
<line x1="342" y1="82" x2="478" y2="82"/><line x1="342" y1="177" x2="478" y2="177"/><line x1="342" y1="272" x2="478" y2="272"/>
</g>
<text x="214" y="134" class="y">否</text><text x="214" y="229" class="y">否</text><text x="214" y="324" class="y">否</text>
<text x="410" y="72" class="y">是</text><text x="410" y="167" class="y">是</text><text x="410" y="262" class="y">是</text>

<rect x="480" y="52" width="290" height="60" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="625" y="80" class="a">办公 Agent</text><text x="625" y="101" class="s">WorkBuddy / DuMate</text>
<rect x="480" y="147" width="290" height="60" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="625" y="175" class="a">编程 Agent</text><text x="625" y="196" class="s">Codex</text>
<rect x="480" y="242" width="290" height="60" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="625" y="270" class="a">视频生成模型</text><text x="625" y="291" class="s">Seedance（先准备首尾帧）</text>
<text x="625" y="350" class="s">拿不准时：从权限最小、成本最低的一种开始</text>
<text x="625" y="372" class="s">用自己的样例测试，再决定是否升级</text>
</svg>
