<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="聊天式用法与任务式用法对比" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle}
.h{font-size:20px;font-weight:700;fill:#1e293b}
.b{font-size:15px;fill:#1e293b}
</style></defs>
<rect width="800" height="350" rx="16" fill="#fff"/>
<rect x="30" y="15" width="340" height="320" rx="14" fill="#f1f5f9"/>
<text x="200" y="50" class="h">聊天式用法 ≈ 问路</text>
<rect x="60" y="90" width="280" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="121" class="b">你：提一个问题</text>
<rect x="60" y="170" width="280" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="201" class="b">AI：给一段回答</text>
<rect x="60" y="250" width="280" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="281" class="b">交付物：文字</text>
<line x1="200" y1="140" x2="200" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="200" y1="220" x2="200" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

<rect x="400" y="15" width="370" height="320" rx="14" fill="#eff6ff"/>
<text x="585" y="50" class="h">任务式用法 ≈ 找驾驶员</text>
<rect x="430" y="80" width="310" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6"/><text x="585" y="108" class="b">你：交代一个目标</text>
<rect x="430" y="144" width="310" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6"/><text x="585" y="172" class="b">AI：拆解成步骤</text>
<rect x="430" y="208" width="310" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6"/><text x="585" y="236" class="b">AI：调用工具，逐步执行</text>
<rect x="430" y="272" width="310" height="44" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="585" y="300" class="b">交付物：文件、图片、网页、视频</text>
<line x1="585" y1="124" x2="585" y2="142" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
<line x1="585" y1="188" x2="585" y2="206" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
<line x1="585" y1="252" x2="585" y2="270" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
</svg>
