<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="四类 AI 工具：对话助手、办公 Agent、编程 Agent、生成模型" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle}
.h{font-size:19px;font-weight:700;fill:#fff}
.n{font-size:17px;font-weight:700;fill:#1e293b}
.l{font-size:13px;font-weight:700;fill:#64748b}
.s{font-size:14px;fill:#334155}
</style></defs>
<rect width="800" height="360" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="22" font-weight="700" fill="#1e293b">四类工具，四种分工</text>

<g>
<rect x="18" y="56" width="176" height="288" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
<path d="M18 68 a12 12 0 0 1 12 -12 h152 a12 12 0 0 1 12 12 v30 h-176 z" fill="#3b82f6"/>
<text x="106" y="84" class="h">对话助手</text>
<text x="106" y="128" class="n">DeepSeek</text><text x="106" y="152" class="n">Qwen</text>
<text x="106" y="188" class="l">输入</text><text x="106" y="208" class="s">问题、文字、资料</text>
<text x="106" y="242" class="l">成果</text><text x="106" y="262" class="s">文字、方案、提纲</text>
<text x="106" y="296" class="l">特点</text><text x="106" y="316" class="s">不直接改你的文件</text>
</g>
<g>
<rect x="214" y="56" width="176" height="288" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/>
<path d="M214 68 a12 12 0 0 1 12 -12 h152 a12 12 0 0 1 12 12 v30 h-176 z" fill="#22c55e"/>
<text x="302" y="84" class="h">办公 Agent</text>
<text x="302" y="128" class="n">WorkBuddy</text><text x="302" y="152" class="n">DuMate</text>
<text x="302" y="188" class="l">输入</text><text x="302" y="208" class="s">授权的文件夹</text>
<text x="302" y="242" class="l">成果</text><text x="302" y="262" class="s">文档、表格、PPT</text>
<text x="302" y="296" class="l">特点</text><text x="302" y="316" class="s">能读写本地文件</text>
</g>
<g>
<rect x="410" y="56" width="176" height="288" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<path d="M410 68 a12 12 0 0 1 12 -12 h152 a12 12 0 0 1 12 12 v30 h-176 z" fill="#f59e0b"/>
<text x="498" y="84" class="h">编程 Agent</text>
<text x="498" y="140" class="n">Codex</text>
<text x="498" y="188" class="l">输入</text><text x="498" y="208" class="s">项目文件夹、需求</text>
<text x="498" y="242" class="l">成果</text><text x="498" y="262" class="s">网页、脚本、修复</text>
<text x="498" y="296" class="l">特点</text><text x="498" y="316" class="s">能运行命令，需审核</text>
</g>
<g>
<rect x="606" y="56" width="176" height="288" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
<path d="M606 68 a12 12 0 0 1 12 -12 h152 a12 12 0 0 1 12 12 v30 h-176 z" fill="#8b5cf6"/>
<text x="694" y="84" class="h">生成模型</text>
<text x="694" y="140" class="n">Seedance</text>
<text x="694" y="188" class="l">输入</text><text x="694" y="208" class="s">首尾帧图片、提示词</text>
<text x="694" y="242" class="l">成果</text><text x="694" y="262" class="s">视频片段</text>
<text x="694" y="296" class="l">特点</text><text x="694" y="316" class="s">按秒或按用量计费</text>
</g>
</svg>
