<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="AI 像聪明但没有经验的实习生" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.t{font-size:22px;font-weight:700;fill:#1e293b;text-anchor:middle}
.h{font-size:20px;font-weight:700;fill:#fff;text-anchor:middle}
.i{font-size:16px;fill:#1e293b}
</style></defs>
<rect width="800" height="360" rx="16" fill="#f8fafc"/>
<text x="400" y="40" class="t">AI 像一个聪明但没有经验的实习生</text>

<rect x="30" y="62" width="360" height="270" rx="14" fill="#fff" stroke="#22c55e" stroke-width="2"/>
<path d="M30 76 a14 14 0 0 1 14 -14 h332 a14 14 0 0 1 14 14 v34 h-360 z" fill="#22c55e"/>
<text x="210" y="93" class="h">擅长：放心交给它</text>
<g fill="#22c55e"><circle cx="62" cy="144" r="6"/><circle cx="62" cy="188" r="6"/><circle cx="62" cy="232" r="6"/><circle cx="62" cy="276" r="6"/></g>
<text x="80" y="150" class="i">快速起草初稿</text>
<text x="80" y="194" class="i">整理、总结长文本</text>
<text x="80" y="238" class="i">多种风格的改写与翻译</text>
<text x="80" y="282" class="i">批量处理重复工作</text>

<rect x="410" y="62" width="360" height="270" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<path d="M410 76 a14 14 0 0 1 14 -14 h332 a14 14 0 0 1 14 14 v34 h-360 z" fill="#f59e0b"/>
<text x="590" y="93" class="h">需要你把关</text>
<g fill="#f59e0b"><circle cx="442" cy="140" r="6"/><circle cx="442" cy="180" r="6"/><circle cx="442" cy="220" r="6"/><circle cx="442" cy="260" r="6"/><circle cx="442" cy="300" r="6"/></g>
<text x="460" y="146" class="i">会编造数据和引用</text>
<text x="460" y="186" class="i">不了解最新信息</text>
<text x="460" y="226" class="i">不了解你的背景</text>
<text x="460" y="266" class="i">图片文字、数量等细节易错</text>
<text x="460" y="306" class="i">隐私信息不要乱发</text>
</svg>
