<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-label="从杂乱文件到 AI 自动整理和生成项目报告的流程图"><rect width="1000" height="450" rx="16" fill="#F4F7FA"/><text x="500" y="55" text-anchor="middle" fill="#294A67" font-family="sans-serif" font-size="29" font-weight="bold">AI 入门第一课：从 24 个文件到一份工作简报</text><g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#294A67"><rect x="35" y="120" width="200" height="190" rx="16" fill="#fff" stroke="#C8D8E6" stroke-width="3"/><text x="135" y="167" font-weight="bold">24 个混合文件</text><text x="135" y="208" font-size="16">Word · PDF · Excel</text><text x="135" y="239" font-size="16">CSV · TXT · SVG</text><text x="135" y="271" font-size="16">内容杂乱且有冲突</text><rect x="287" y="120" width="200" height="190" rx="16" fill="#E7F3FA" stroke="#7CA5C6" stroke-width="3"/><text x="387" y="166" font-weight="bold">DuMate 分析</text><text x="387" y="207" font-size="16">先规划，再确认</text><text x="387" y="238" font-size="16">按内容分类归档</text><text x="387" y="269" font-size="16">输出文件清单</text><rect x="540" y="120" width="200" height="190" rx="16" fill="#fff" stroke="#C8D8E6" stroke-width="3"/><text x="640" y="166" font-weight="bold">跨文件汇总</text><text x="640" y="207" font-size="16">计算订单和预算</text><text x="640" y="238" font-size="16">发现数据冲突</text><text x="640" y="269" font-size="16">标出待确认事项</text><rect x="792" y="120" width="172" height="190" rx="16" fill="#E7F8F4" stroke="#5AAE9A" stroke-width="3"/><text x="878" y="166" font-weight="bold">最终交付</text><text x="878" y="207" font-size="16">项目工作简报</text><text x="878" y="238" font-size="16">指标汇总 CSV</text><text x="878" y="269" font-size="16">风险与待办</text></g><g fill="none" stroke="#27AECB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M242 216h34m-13-12 13 12-13 12"/><path d="M494 216h34m-13-12 13 12-13 12"/><path d="M748 216h34m-13-12 13 12-13 12"/></g><text x="500" y="374" text-anchor="middle" fill="#536B7A" font-family="sans-serif" font-si