<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="选择 AI 工具前先问三个问题：输入、动作、成果" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle}
.q{font-size:14px;font-weight:700;fill:#64748b}
.t{font-size:20px;font-weight:700;fill:#1e293b}
.s{font-size:14px;fill:#475569}
</style></defs>
<rect width="800" height="270" rx="16" fill="#f8fafc"/>
<text x="400" y="40" font-size="22" font-weight="700" fill="#1e293b">选工具之前，先问三个问题</text>

<rect x="30" y="65" width="200" height="130" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="130" y="95" class="q">问题 1</text><text x="130" y="127" class="t">我要输入什么？</text>
<text x="130" y="157" class="s">一句话、表格、图片、</text><text x="130" y="178" class="s">整个项目文件夹</text>

<rect x="300" y="65" width="200" height="130" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="400" y="95" class="q">问题 2</text><text x="400" y="127" class="t">要它做什么动作？</text>
<text x="400" y="157" class="s">只回答、改文件、</text><text x="400" y="178" class="s">运行命令、生成素材</text>

<rect x="570" y="65" width="200" height="130" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
<text x="670" y="95" class="q">问题 3</text><text x="670" y="127" class="t">最后交付什么？</text>
<text x="670" y="157" class="s">文字、Word / Excel、</text><text x="670" y="178" class="s">网页、图片、视频</text>

<g stroke="#64748b" stroke-width="2" marker-end="url(#a)">
<line x1="232" y1="130" x2="296" y2="130"/><line x1="502" y1="130" x2="566" y2="130"/>
</g>
<text x="400" y="240" font-size="16" fill="#334155">三个问题答完，工具的类型基本就确定了，再挑具体产品</text>
</svg>
