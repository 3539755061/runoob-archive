ound"/><path d="M605 185 L616 192 L605 199" fill="none" stroke="#7193a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="390" text-anchor="middle" font-size="17" fill="#526a7b" font-family="Arial,'Noto Sans CJK SC',sans-serif">把需求说具体，比堆砌夸张形容词更有效</text></svg>